<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Drug - PIMS</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container mt-4">

<div class="card shadow">

<div class="card-header bg-success text-white">
<h3 class="text-center">💊 Add New Drug</h3>
</div>

<div class="card-body">

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">
<label>Drug Name</label>
<input type="text" name="drug_name" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Brand Name</label>
<input type="text" name="brand_name" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Pharmacological Class</label>
<input type="text" name="pharmacological_class" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Schedule</label>
<select name="schedule" class="form-select">
<option>Schedule H</option>
<option>Schedule H1</option>
<option>Schedule X</option>
<option>OTC</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Dosage Form</label>
<select name="dosage_form" class="form-select">
<option>Tablet</option>
<option>Capsule</option>
<option>Syrup</option>
<option>Injection</option>
<option>Cream</option>
<option>Drops</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Storage</label>
<input type="text" name="storage" class="form-control" placeholder="Room Temperature">
</div>

<div class="col-md-6 mb-3">
<label>Category</label>
<input type="text" name="category" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Stock</label>
<input type="number" name="stock" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Expiry Date</label>
<input type="date" name="expiry_date" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Price (₹)</label>
<input type="number" step="0.01" name="price" class="form-control" required>
</div>

</div>

<div class="text-center">

<button type="submit" class="btn btn-success">
💾 Save Drug
</button>

<a href="/dashboard" class="btn btn-secondary">
⬅ Back
</a>

</div>

</form>

</div>

</div>

</div>

</body>
</html>
