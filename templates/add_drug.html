<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add New Drug | PIMS Premium</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
background:#eef2ff;
font-family:'Segoe UI',sans-serif;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:260px;
height:100vh;
background:linear-gradient(180deg,#4f46e5,#7c3aed);
padding:25px;
color:white;
}

.sidebar .logo{
font-size:28px;
font-weight:bold;
text-align:center;
margin-bottom:35px;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:14px 18px;
margin-bottom:10px;
border-radius:12px;
transition:.3s;
}

.sidebar a:hover,
.sidebar a.active{
background:rgba(255,255,255,.18);
}

.main{
margin-left:260px;
padding:30px;
}

.card{
border:none;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">
<i class="bi bi-hospital"></i><br>
PIMS Premium
</div>

<a href="/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>

<a href="/drugs" class="active"><i class="bi bi-capsule"></i> Drug Management</a>

<a href="/sales"><i class="bi bi-cart-check"></i> Sales</a>

<a href="/reports"><i class="bi bi-bar-chart"></i> Reports</a>

<a href="/"><i class="bi bi-box-arrow-right"></i> Logout</a>

</div>

<div class="main">

<div class="card">

<div class="card-header bg-primary text-white">

<h4>
<i class="bi bi-plus-circle"></i>
Add New Drug
</h4>

</div>

<div class="card-body">

<form method="POST" action="/add-drug">

    <div class="row">

    <div class="col-md-6 mb-3">
        <label class="form-label">Drug Name</label>
        <input type="text" class="form-control" name="drug_name" required>
    </div>

    <div class="col-md-6 mb-3">
        <label class="form-label">Brand Name</label>
        <input type="text" class="form-control" name="brand_name" required>
    </div>

    <div class="col-md-6 mb-3">
        <label class="form-label">Pharmacological Class</label>
        <input type="text" class="form-control" name="pharmacological_class">
    </div>

    <div class="col-md-6 mb-3">
        <label class="form-label">Schedule</label>
        <input type="text" class="form-control" name="schedule">
    </div>

    <div class="col-md-6 mb-3">
        <label class="form-label">Dosage Form</label>
        <select class="form-select" name="dosage_form">
            <option>Tablet</option>
            <option>Capsule</option>
            <option>Syrup</option>
            <option>Injection</option>
            <option>Cream</option>
            <option>Drops</option>
        </select>
    </div>

    <div class="col-md-6 mb-3">
        <label class="form-label">Storage</label>
        <input type="text" class="form-control" name="storage" placeholder="Room Temperature / Refrigerated">
    </div>

    <div class="col-md-6 mb-3">
        <label class="form-label">Category</label>
        <input type="text" class="form-control" name="category">
    </div>

    <div class="col-md-3 mb-3">
        <label class="form-label">Stock</label>
        <input type="number" class="form-control" name="stock" required>
    </div>

    <div class="col-md-3 mb-3">
        <label class="form-label">Price (₹)</label>
        <input type="number" step="0.01" class="form-control" name="price" required>
    </div>

    <div class="col-md-6 mb-3">
        <label class="form-label">Expiry Date</label>
        <input type="date" class="form-control" name="expiry_date" required>
    </div>

</div>

<div class="mt-4">

    <button type="submit" class="btn btn-success btn-lg">
        <i class="bi bi-check-circle"></i>
        Save Drug
    </button>

    <button type="reset" class="btn btn-secondary btn-lg">
        <i class="bi bi-arrow-clockwise"></i>
        Reset
    </button>

    <a href="/drugs" class="btn btn-danger btn-lg">
        <i class="bi bi-arrow-left"></i>
        Back
    </a>

</div>

</form>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
