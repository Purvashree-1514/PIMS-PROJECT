<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Sale</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script>
async function getPrice() {

    let drug = document.getElementById("drug_name").value;

    if(drug=="") return;

    let response = await fetch("/get-price/" + drug);
    let data = await response.json();

    document.getElementById("price").value = data.price;
    document.getElementById("stock").value = data.stock;

    calculateTotal();
}

function calculateTotal(){

    let price = parseFloat(document.getElementById("price").value) || 0;
    let qty = parseInt(document.getElementById("quantity").value) || 0;

    document.getElementById("total_amount").value = price * qty;
}
</script>

</head>


<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-success text-white">
<h3>Add New Sale</h3>
</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">
<label>Customer Name</label>
<input type="text" name="customer_name" class="form-control" required>
</div>

<div class="mb-3">
<label>Drug Name</label>

<select name="drug_name" class="form-select" required>
<option value="">Select Drug</option>

{% for drug in drugs %}
<option value="{{ drug[0] }}">
{{ drug[0] }}
</option>
{% endfor %}

</select>
</div>

<div class="mb-3">
<label>Quantity</label>
<input type="number" name="quantity" class="form-control" required>
</div>

<button type="submit" class="btn btn-success">
Save Sale
</button>

<a href="/sales" class="btn btn-secondary">
Back
</a>

</form>

</div>

</div>

</div>

</body>
</html>
