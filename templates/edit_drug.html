<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PIMS Premium - Edit Drug</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#eef2ff;
}

.sidebar{
position:fixed;
top:0;
left:0;
width:260px;
height:100vh;
background:linear-gradient(180deg,#4f46e5,#7c3aed);
padding:25px;
color:white;
}

.logo{
font-size:28px;
font-weight:bold;
text-align:center;
margin-bottom:35px;
}

.sidebar a{
display:block;
padding:14px 18px;
margin-bottom:10px;
text-decoration:none;
color:white;
border-radius:12px;
transition:.3s;
}

.sidebar a:hover,
.sidebar a.active{
background:rgba(255,255,255,.18);
}

.main{
margin-left:260px;
padding:25px;
}

.header{
background:white;
padding:20px;
border-radius:18px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 8px 20px rgba(0,0,0,.08);
margin-bottom:25px;
}

.card-box{
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 8px 20px rgba(0,0,0,.08);
}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">
<i class="bi bi-hospital"></i><br>
PIMS Premium
</div>

<a href="/dashboard">
<i class="bi bi-speedometer2"></i>
Dashboard
</a>

<a href="/drugs" class="active">
<i class="bi bi-capsule"></i>
Drug Management
</a>

<a href="/sales">
<i class="bi bi-cart-check"></i>
Sales
</a>

<a href="/reports">
<i class="bi bi-bar-chart"></i>
Reports
</a>

<a href="/settings">
<i class="bi bi-gear"></i>
Settings
</a>

<a href="/">
<i class="bi bi-box-arrow-right"></i>
Logout
</a>

</div>

<div class="main">

<div class="header">

<div>

<h3>✏️ Edit Drug</h3>

<small>Update Medicine Information</small>

</div>

<a href="/drugs" class="btn btn-secondary">

<i class="bi bi-arrow-left"></i>

Back

</a>

</div>

<div class="card-box">

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Drug Name</label>

<input
type="text"
name="drug_name"
class="form-control"
value="{{ drug[1] }}"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Brand Name</label>

<input
type="text"
name="brand_name"
class="form-control"
value="{{ drug[2] }}"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Pharmacological Class</label>

<input
type="text"
name="pharmacological_class"
class="form-control"
value="{{ drug[3] }}">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Schedule</label>

<input
type="text"
name="schedule"
class="form-control"
value="{{ drug[4] }}">

<div class="col-md-6 mb-3">

<label class="form-label">
Dosage Form
</label>

<input
type="text"
name="dosage_form"
class="form-control"
value="{{ drug[5] }}">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Storage
</label>

<input
type="text"
name="storage"
class="form-control"
value="{{ drug[6] }}">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Category
</label>

<input
type="text"
name="category"
class="form-control"
value="{{ drug[7] }}">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Total Stock
</label>

<input
type="number"
name="stock"
class="form-control"
value="{{ drug[8] }}"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Reorder Level
</label>

<input
type="number"
name="reorder_level"
class="form-control"
value="{{ drug[9] }}"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Expiry Date
</label>

<input
type="date"
name="expiry_date"
class="form-control"
value="{{ drug[10] }}"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">
Price (₹)
</label>

<input
type="number"
step="0.01"
name="price"
class="form-control"
value="{{ drug[11] }}"
required>

</div>

</div>

<div class="mt-4">

<button
type="submit"
class="btn btn-success btn-lg">

<i class="bi bi-check-circle"></i>

Update Drug

</button>

<button
type="reset"
class="btn btn-secondary btn-lg ms-2">

<i class="bi bi-arrow-clockwise"></i>

Reset

</button>

<a
href="/drugs"
class="btn btn-danger btn-lg ms-2">

<i class="bi bi-x-circle"></i>

Cancel

</a>

</div>

</form>

</div>

<!-- Footer -->

<footer class="text-center mt-5 text-muted">

<hr>

<p class="mb-0">

© 2026 <strong>PIMS Premium</strong> |
Pharmacy Inventory Management System

</p>

</footer>

</div>
<!-- End Main -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
