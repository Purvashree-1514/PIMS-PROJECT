<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Drug - PIMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning">
            <h3>Edit Drug</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label>Drug Name</label>
                    <input type="text" class="form-control"
                           name="drug_name"
                           value="{{ drug[1] }}" required>
                </div>

                <div class="mb-3">
                    <label>Brand Name</label>
                    <input type="text" class="form-control"
                           name="brand_name"
                           value="{{ drug[2] }}" required>
                </div>

                <div class="mb-3">
                    <label>Pharmacological Class</label>
                    <input type="text" class="form-control"
                           name="pharmacological_class"
                           value="{{ drug[3] }}" required>
                </div>

                <div class="mb-3">
                    <label>Schedule</label>
                    <input type="text" class="form-control"
                           name="schedule"
                           value="{{ drug[4] }}" required>
                </div>

                <div class="mb-3">
                    <label>Dosage Form</label>
                    <input type="text" class="form-control"
                           name="dosage_form"
                           value="{{ drug[5] }}" required>
                </div>

                <div class="mb-3">
                    <label>Storage</label>
                    <input type="text" class="form-control"
                           name="storage"
                           value="{{ drug[6] }}" required>
                </div>

                <div class="mb-3">
                    <label>Category</label>
                    <input type="text" class="form-control"
                           name="category"
                           value="{{ drug[7] }}" required>
                </div>

                <div class="mb-3">
                    <label>Stock</label>
                    <input type="number" class="form-control"
                           name="stock"
                           value="{{ drug[8] }}" required>
                </div>

                <div class="mb-3">
                    <label>Expiry Date</label>
                    <input type="date" class="form-control"
                           name="expiry_date"
                           value="{{ drug[9] }}" required>
                </div>

                <div class="mb-3">
                    <label>Price</label>
                    <input type="number" step="0.01"
                           class="form-control"
                           name="price"
                           value="{{ drug[10] }}" required>
                </div>

                <button type="submit" class="btn btn-warning">
                    Update Drug
                </button>

                <a href="/dashboard" class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
