<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Sale</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning">
<h3>Edit Sale</h3>
</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">
<label>Customer Name</label>
<input type="text"
       name="customer_name"
       class="form-control"
       value="{{ sale[1] }}"
       required>
</div>

<div class="mb-3">
<label>Drug Name</label>
<input type="text"
       name="drug_name"
       class="form-control"
       value="{{ sale[2] }}"
       required>
</div>

<div class="mb-3">
<label>Quantity</label>
<input type="number"
       name="quantity"
       class="form-control"
       value="{{ sale[3] }}"
       required>
</div>

<div class="mb-3">
<label>Total Amount</label>
<input type="number"
       step="0.01"
       name="total_amount"
       class="form-control"
       value="{{ sale[4] }}"
       required>
</div>

<button type="submit" class="btn btn-warning">
Update Sale
</button>

<a href="/sales" class="btn btn-secondary">
Back
</a>

</form>

</div>

</div>

</div>

</body>
</html>
