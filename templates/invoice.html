<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invoice</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f8f9fa;
}
.invoice{
    max-width:700px;
    margin:30px auto;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}
</style>

</head>

<body>

<div class="invoice">

<h2 class="text-center text-success">
🏥 Pharmacy Invoice
</h2>

<hr>

<table class="table table-bordered">

<tr>
    <th>Customer Name</th>
    <td>{{ invoice[0] }}</td>
</tr>

<tr>
    <th>Drug Name</th>
    <td>{{ invoice[1] }}</td>
</tr>

<tr>
    <th>Quantity</th>
    <td>{{ invoice[2] }}</td>
</tr>

<tr>
    <th>Total Amount</th>
    <td>₹ {{ invoice[3] }}</td>
</tr>

<tr>
    <th>Date</th>
    <td>{{ invoice[4] }}</td>
</tr>


</table>

<div class="text-center">

<button class="btn btn-primary" onclick="window.print()">
🖨 Print Invoice
</button>

<a href="/sales" class="btn btn-secondary">
Back
</a>

</div>

</div>

</body>
</html>
