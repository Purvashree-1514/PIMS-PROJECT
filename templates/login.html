<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PIMS Premium Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#4f46e5,#7c3aed);
}

.login-box{
width:420px;
background:#fff;
padding:40px;
border-radius:20px;
box-shadow:0 15px 35px rgba(0,0,0,.25);
}

.logo{
text-align:center;
font-size:55px;
color:#4f46e5;
margin-bottom:15px;
}

h2{
text-align:center;
font-weight:bold;
margin-bottom:5px;
}

p{
text-align:center;
color:#777;
margin-bottom:25px;
}

.form-control{
height:50px;
border-radius:12px;
}

.btn-login{
width:100%;
height:50px;
border-radius:12px;
font-size:18px;
font-weight:bold;
background:#4f46e5;
border:none;
}

.btn-login:hover{
background:#4338ca;
}

.footer{
text-align:center;
margin-top:20px;
font-size:14px;
color:#777;
}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">
<i class="bi bi-hospital"></i>
</div>

<h2>PIMS Premium</h2>

<p>Pharmacy Inventory Management System</p>

{% if error %}
<div class="alert alert-danger">
{{ error }}
</div>
{% endif %}

<form method="POST">

<div class="mb-3">
<label class="form-label">Username</label>
<input
type="text"
name="username"
class="form-control"
placeholder="Enter Username"
required>
</div>

<div class="mb-3">
<label class="form-label">Password</label>
<input
type="password"
name="password"
class="form-control"
placeholder="Enter Password"
required>
</div>

<button type="submit" class="btn btn-primary btn-login">
<i class="bi bi-box-arrow-in-right"></i>
Login
</button>

</form>

<div class="footer">
© 2026 PIMS Premium
</div>

</div>

</body>
</html>
