<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales - PIMS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2>Sales Management</h2>

    <hr>

    <div class="d-flex justify-content-between mb-3">

        <a href="/add-sale" class="btn btn-success">
            + New Sale
        </a>

        <input type="text"
               class="form-control"
               placeholder="Search Sale..."
               style="width:300px;">

    </div>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Customer Name</th>
                <th>Drug Name</th>
                <th>Quantity</th>
                <th>Total Amount</th>
                <th>Sale Date</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>

        {% for sale in sales %}

        <tr>

            <td>{{ sale[0] }}</td>
            <td>{{ sale[1] }}</td>
            <td>{{ sale[2] }}</td>
            <td>{{ sale[3] }}</td>
            <td>₹ {{ sale[4] }}</td>
            <td>{{ sale[5] }}</td>

            <td>

                <a href="/invoice/{{ sale[0] }}" class="btn btn-primary btn-sm">
                    Invoice
                </a>

                <a href="/edit-sale/{{ sale[0] }}" class="btn btn-warning btn-sm">
                    Edit
                </a>

                <a href="/delete-sale/{{ sale[0] }}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Delete this sale?')">
                    Delete
                </a>

            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

    <a href="/dashboard" class="btn btn-secondary">
        Back to Dashboard
    </a>

</div>

</body>
</html>
